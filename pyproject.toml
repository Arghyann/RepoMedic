[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repomedic"
version = "0.1.0"
description = "Local-first, MCP-native multi-agent code doctor powered by Gemma via Ollama"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pytest>=8",
]

[project.scripts]
repomedic = "repomedic.cli:main"
repomedic-mcp = "repomedic.mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["repomedic*"]

[tool.setuptools.package-data]
"repomedic.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
